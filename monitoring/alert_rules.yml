groups:
  - name: sonar-sentry-alerts
    rules:
      - alert: HighRequestLatency
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, endpoint)) > 1.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High request latency detected on {{ $labels.endpoint }}"
          description: "95th percentile latency is {{ $value }} seconds."

      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected"
          description: "HTTP 5xx rate exceeds 5% over 5m window."

      - alert: SonarBackendDown
        expr: up{job="sonar-sentry"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Sonar Sentry backend service is unreachable"
          description: "Prometheus target has failed health probe."
