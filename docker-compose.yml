version: '3.8'
services:
  backend:
    build: .
    ports: ["8000:8000"]
    env_file: .env.example
    environment:
      - YOLO_OFFLINE=1
      - ULTRALYTICS_AUTOINSTALL=0
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports: ["4173:4173"]
    environment:
      - VITE_API_URL=http://backend:8000
      - VITE_WS_URL=ws://backend:8000
    depends_on: [backend]
    restart: unless-stopped
